services:
  tmuapp:
    build: .
    image: ghcr.io/bangwu/tmuapp:local
    ports:
      - "8787:8787"
    environment:
      PORT: "8787"
      # Set TMUAPP_TOKEN before exposing tmuapp outside a trusted local network.
      # TMUAPP_TOKEN: "change-me"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - /tmp:/tmp
