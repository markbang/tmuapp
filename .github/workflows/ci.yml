name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web-api:
    name: Web and API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vp run -r build
      - run: pnpm exec vp check
      - run: pnpm exec vp run -r test
      - run: pnpm -F website exec playwright install --with-deps chromium
      - run: pnpm exec vp run website#e2e

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: web-api
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository }}:latest

  android:
    name: Android release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Decode release signing key
        if: ${{ github.event_name == 'push' }}
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_SIGNING_KEYSTORE_BASE64"
          echo "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > apps/android/release.keystore
      - name: Build release APK
        run: gradle -p apps/android assembleRelease --stacktrace
      - name: Prepare release APK assets
        run: |
          version="$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' apps/android/app/build.gradle.kts)"
          test -n "$version"

          output_dir="apps/android/app/build/outputs/apk/release"
          asset_dir="apps/android/release-apks"
          mkdir -p "$asset_dir"

          source_apk="$output_dir/app-release-unsigned.apk"
          if [ ! -f "$source_apk" ]; then
            source_apk="$output_dir/app-release.apk"
          fi
          test -f "$source_apk"

          cp "$source_apk" "$asset_dir/tmuapp-v$version.apk"
          python3 - "$source_apk" "$asset_dir" "$version" <<'PY'
          import sys
          import zipfile
          from pathlib import Path

          source = Path(sys.argv[1])
          asset_dir = Path(sys.argv[2])
          version = sys.argv[3]
          targets = {
              "arm64-v8a": f"tmuapp-arm64-v8a-v{version}.apk",
              "armeabi-v7a": f"tmuapp-armeabi-v7a-v{version}.apk",
              "x86": f"tmuapp-x86-v{version}.apk",
              "x86_64": f"tmuapp-x86_64-v{version}.apk",
          }

          with zipfile.ZipFile(source, "r") as src:
              entries = [(info, src.read(info.filename)) for info in src.infolist()]

          for abi, filename in targets.items():
              with zipfile.ZipFile(asset_dir / filename, "w") as dest:
                  for info, data in entries:
                      parts = info.filename.split("/")
                      if parts[0] == "META-INF":
                          continue
                      if parts[0] == "lib" and len(parts) > 2 and parts[1] != abi:
                          continue
                      dest.writestr(info, data)
          PY

          ls -lh "$asset_dir"
      - name: Sign release APK assets
        if: ${{ github.event_name == 'push' }}
        env:
          ANDROID_SIGNING_STORE_FILE: ${{ github.workspace }}/apps/android/release.keystore
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          build_tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          for apk in apps/android/release-apks/*.apk; do
            aligned="${apk%.apk}-aligned.apk"
            signed="${apk%.apk}-signed.apk"
            "$build_tools/zipalign" -f -p 4 "$apk" "$aligned"
            "$build_tools/apksigner" sign \
              --ks "$ANDROID_SIGNING_STORE_FILE" \
              --ks-pass "pass:$ANDROID_SIGNING_STORE_PASSWORD" \
              --ks-key-alias "$ANDROID_SIGNING_KEY_ALIAS" \
              --key-pass "pass:$ANDROID_SIGNING_KEY_PASSWORD" \
              --out "$signed" \
              "$aligned"
            mv "$signed" "$apk"
            rm "$aligned"
          done
      - name: Verify release APK signature
        if: ${{ github.event_name == 'push' }}
        run: |
          apksigner="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          for apk in apps/android/release-apks/*.apk; do
            "$apksigner" verify --print-certs "$apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: tmuapp-release-apk
          path: apps/android/release-apks/*.apk
