name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web-api:
    name: Web and API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vp run -r build
      - run: pnpm exec vp check
      - run: pnpm exec vp run -r test
      - run: pnpm -F website exec playwright install --with-deps chromium
      - run: pnpm exec vp run website#e2e

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: web-api
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository }}:latest

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - run: gradle -p apps/android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: tmuapp-debug-apk
          path: apps/android/app/build/outputs/apk/debug/*.apk
