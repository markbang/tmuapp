name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web-api:
    name: Web and API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vp run -r build
      - run: pnpm exec vp check
      - run: pnpm exec vp run -r test
      - run: pnpm -F website exec playwright install --with-deps chromium
      - run: pnpm exec vp run website#e2e

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: web-api
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository }}:latest

  android:
    name: Android release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Decode release signing key
        if: ${{ github.event_name == 'push' }}
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_SIGNING_KEYSTORE_BASE64"
          echo "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > apps/android/release.keystore
      - name: Build release APK
        env:
          ANDROID_SIGNING_STORE_FILE: ${{ github.workspace }}/apps/android/release.keystore
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: gradle -p apps/android assembleRelease
      - name: Prepare release APK assets
        run: |
          version="$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' apps/android/app/build.gradle.kts)"
          test -n "$version"

          output_dir="apps/android/app/build/outputs/apk/release"
          asset_dir="apps/android/release-apks"
          mkdir -p "$asset_dir"

          cp "$output_dir/app-arm64-v8a-release.apk" "$asset_dir/tmuapp-arm64-v8a-v$version.apk"
          cp "$output_dir/app-armeabi-v7a-release.apk" "$asset_dir/tmuapp-armeabi-v7a-v$version.apk"
          cp "$output_dir/app-x86-release.apk" "$asset_dir/tmuapp-x86-v$version.apk"
          cp "$output_dir/app-x86_64-release.apk" "$asset_dir/tmuapp-x86_64-v$version.apk"
          cp "$output_dir/app-universal-release.apk" "$asset_dir/tmuapp-v$version.apk"

          ls -lh "$asset_dir"
      - name: Verify release APK signature
        if: ${{ github.event_name == 'push' }}
        run: |
          apksigner="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          for apk in apps/android/release-apks/*.apk; do
            "$apksigner" verify --print-certs "$apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: tmuapp-release-apk
          path: apps/android/release-apks/*.apk
