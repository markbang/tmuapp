name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web-api:
    name: Web and API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vp run -r build
      - run: pnpm exec vp check
      - run: pnpm exec vp run -r test
      - run: pnpm -F website exec playwright install --with-deps chromium
      - run: pnpm exec vp run website#e2e

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: web-api
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read release version
        id: version
        run: |
          version="$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' apps/android/app/build.gradle.kts)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:v${{ steps.version.outputs.version }}

  android:
    name: Android release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Decode release signing key
        if: ${{ github.event_name == 'push' }}
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_SIGNING_KEYSTORE_BASE64"
          echo "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > apps/android/release.keystore
      - name: Generate temporary release signing key
        if: ${{ github.event_name != 'push' }}
        run: |
          keytool -genkeypair \
            -storetype PKCS12 \
            -keystore apps/android/release.keystore \
            -storepass android \
            -alias tmuapp-ci \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=tmuapp CI,O=tmuapp,C=US"
      - name: Build release APK
        run: gradle -p apps/android assembleRelease --stacktrace
      - name: Prepare release APK assets
        run: |
          version="$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' apps/android/app/build.gradle.kts)"
          test -n "$version"

          output_dir="apps/android/app/build/outputs/apk/release"
          asset_dir="apps/android/release-apks"
          mkdir -p "$asset_dir"

          source_apk="$output_dir/app-release-unsigned.apk"
          if [ ! -f "$source_apk" ]; then
            source_apk="$output_dir/app-release.apk"
          fi
          test -f "$source_apk"

          cp "$source_apk" "$asset_dir/tmuapp-v$version.apk"
          python3 - "$source_apk" "$asset_dir" "$version" <<'PY'
          import sys
          import zipfile
          from pathlib import Path

          source = Path(sys.argv[1])
          asset_dir = Path(sys.argv[2])
          version = sys.argv[3]
          targets = {
              "arm64-v8a": f"tmuapp-arm64-v8a-v{version}.apk",
              "armeabi-v7a": f"tmuapp-armeabi-v7a-v{version}.apk",
              "x86": f"tmuapp-x86-v{version}.apk",
              "x86_64": f"tmuapp-x86_64-v{version}.apk",
          }

          with zipfile.ZipFile(source, "r") as src:
              entries = [(info, src.read(info.filename)) for info in src.infolist()]

          for abi, filename in targets.items():
              with zipfile.ZipFile(asset_dir / filename, "w") as dest:
                  for info, data in entries:
                      parts = info.filename.split("/")
                      if parts[0] == "META-INF":
                          continue
                      if parts[0] == "lib" and len(parts) > 2 and parts[1] != abi:
                          continue
                      dest.writestr(info, data)
          PY

          ls -lh "$asset_dir"
      - name: Sign release APK assets
        env:
          ANDROID_SIGNING_STORE_FILE: ${{ github.workspace }}/apps/android/release.keystore
          ANDROID_SIGNING_STORE_PASSWORD: ${{ github.event_name == 'push' && secrets.ANDROID_SIGNING_STORE_PASSWORD || 'android' }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ github.event_name == 'push' && secrets.ANDROID_SIGNING_KEY_ALIAS || 'tmuapp-ci' }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ github.event_name == 'push' && secrets.ANDROID_SIGNING_KEY_PASSWORD || 'android' }}
        run: |
          build_tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          for apk in apps/android/release-apks/*.apk; do
            aligned="${apk%.apk}-aligned.apk"
            signed="${apk%.apk}-signed.apk"
            "$build_tools/zipalign" -f -p 4 "$apk" "$aligned"
            "$build_tools/apksigner" sign \
              --ks "$ANDROID_SIGNING_STORE_FILE" \
              --ks-pass "pass:$ANDROID_SIGNING_STORE_PASSWORD" \
              --ks-key-alias "$ANDROID_SIGNING_KEY_ALIAS" \
              --key-pass "pass:$ANDROID_SIGNING_KEY_PASSWORD" \
              --out "$signed" \
              "$aligned"
            mv "$signed" "$apk"
            rm "$aligned"
          done
      - name: Verify release APK signature
        run: |
          apksigner="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          for apk in apps/android/release-apks/*.apk; do
            "$apksigner" verify --print-certs "$apk"
          done
      - name: Smoke test signed release APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: false
          script: |
            set -eu
            mkdir -p apps/android/build/reports
            trap 'adb logcat -d -t 2000 > apps/android/build/reports/release-launch-logcat.txt || true; adb shell dumpsys activity activities > apps/android/build/reports/release-launch-activity.txt || true' EXIT

            version="$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' apps/android/app/build.gradle.kts)"
            for apk in "apps/android/release-apks/tmuapp-v$version.apk" "apps/android/release-apks/tmuapp-x86_64-v$version.apk"; do
              test -f "$apk"
              adb logcat -c
              adb install -r "$apk"
              adb shell am force-stop dev.tmuapp.mobile || true
              adb shell am start -W -n dev.tmuapp.mobile/.MainActivity
              sleep 4
              adb shell pidof dev.tmuapp.mobile | tr -d '\r' | grep -E '^[0-9]+'
              adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity|ResumedActivity' | grep dev.tmuapp.mobile
              adb uninstall dev.tmuapp.mobile
            done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-release-launch-diagnostics
          path: apps/android/build/reports/release-launch-*.txt
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: tmuapp-release-apk
          path: apps/android/release-apks/*.apk
