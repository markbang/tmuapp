name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  docker-release:
    name: Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read release version
        id: version
        run: |
          version="$(sed -n 's/.*versionName = \"\(.*\)\".*/\1/p' apps/android/app/build.gradle.kts)"
          test -n "$version"
          test "${GITHUB_REF_NAME}" = "v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:v${{ steps.version.outputs.version }}

  android-release:
    name: Android release APK and GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Decode release signing key
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_SIGNING_KEYSTORE_BASE64"
          echo "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > apps/android/release.keystore
      - name: Build release APK
        run: gradle -p apps/android assembleRelease --stacktrace
      - name: Prepare release APK assets
        run: |
          version="$(sed -n 's/.*versionName = \"\(.*\)\".*/\1/p' apps/android/app/build.gradle.kts)"
          test -n "$version"

          output_dir="apps/android/app/build/outputs/apk/release"
          asset_dir="apps/android/release-apks"
          mkdir -p "$asset_dir"

          pick_apk() {
            local name="$1"
            local unsigned="$output_dir/$name-release-unsigned.apk"
            local signed="$output_dir/$name-release.apk"
            if [ -f "$unsigned" ]; then
              printf "%s" "$unsigned"
            else
              test -f "$signed"
              printf "%s" "$signed"
            fi
          }

          cp "$(pick_apk app-universal)" "$asset_dir/tmuapp-v$version.apk"
          cp "$(pick_apk app-arm64-v8a)" "$asset_dir/tmuapp-arm64-v8a-v$version.apk"
          cp "$(pick_apk app-armeabi-v7a)" "$asset_dir/tmuapp-armeabi-v7a-v$version.apk"
          cp "$(pick_apk app-x86)" "$asset_dir/tmuapp-x86-v$version.apk"
          cp "$(pick_apk app-x86_64)" "$asset_dir/tmuapp-x86_64-v$version.apk"

          ls -lh "$asset_dir"
      - name: Sign release APK assets
        env:
          ANDROID_SIGNING_STORE_FILE: ${{ github.workspace }}/apps/android/release.keystore
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          build_tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          for apk in apps/android/release-apks/*.apk; do
            aligned="${apk%.apk}-aligned.apk"
            signed="${apk%.apk}-signed.apk"
            "$build_tools/zipalign" -f -p 4 "$apk" "$aligned"
            "$build_tools/apksigner" sign \
              --ks "$ANDROID_SIGNING_STORE_FILE" \
              --ks-pass "pass:$ANDROID_SIGNING_STORE_PASSWORD" \
              --ks-key-alias "$ANDROID_SIGNING_KEY_ALIAS" \
              --key-pass "pass:$ANDROID_SIGNING_KEY_PASSWORD" \
              --out "$signed" \
              "$aligned"
            mv "$signed" "$apk"
            rm "$aligned"
          done
      - name: Verify release APK signature
        run: |
          apksigner="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          for apk in apps/android/release-apks/*.apk; do
            "$apksigner" verify --print-certs "$apk"
          done
      - name: Smoke test signed release APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: false
          script: bash apps/android/ci/smoke-release.sh
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(sed -n 's/.*versionName = \"\(.*\)\".*/\1/p' apps/android/app/build.gradle.kts)"
          tag="v$version"
          notes_file="/tmp/tmuapp-release-notes.md"
          test "${GITHUB_REF_NAME}" = "$tag"

          {
            printf '# tmuapp %s\n\n' "$version"
            printf 'Android APKs are signed release builds generated from Gradle ABI split outputs.\n\n'
            printf 'This release includes:\n\n'
            printf -- '- Android redesign with first-run API setup\n'
            printf -- '- Session overview cards and cockpit controls\n'
            printf -- '- App settings with light/dark theme support\n'
            printf -- '- Real loading, success, warning, and error feedback\n\n'
            printf 'Docker images are published to GHCR with `latest`, `%s`, and `v%s` tags.\n' "$version" "$version"
          } > "$notes_file"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "tmuapp $version" --notes-file "$notes_file"
          else
            gh release create "$tag" --title "tmuapp $version" --notes-file "$notes_file"
          fi

          gh release upload "$tag" --clobber \
            apps/android/release-apks/tmuapp-v$version.apk \
            apps/android/release-apks/tmuapp-arm64-v8a-v$version.apk \
            apps/android/release-apks/tmuapp-armeabi-v7a-v$version.apk \
            apps/android/release-apks/tmuapp-x86-v$version.apk \
            apps/android/release-apks/tmuapp-x86_64-v$version.apk
