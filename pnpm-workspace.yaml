packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@types/node": ^24
  typescript: ^5
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest
  vite-plus: latest
  "@wterm/dom": ^0.3.0
  "@xterm/xterm": ^6.0.0
  "@xterm/addon-image": ^0.9.0
  "@xterm/addon-webgl": ^0.19.0
  "@xterm/addon-ligatures": ^0.10.0
  "@xterm/addon-search": ^0.15.0
  "@playwright/test": ^1.59.1
  react: ^19.2.6
  react-dom: ^19.2.6
  "@heroui/react": ^3.0.4
  "@vitejs/plugin-react": ^6.0.1
  "@types/react": ^19.2.14
  "@types/react-dom": ^19.2.3
  ws: ^8.20.0
  "@types/ws": ^8.18.1
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
